[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nkm"
version = "0.1.0"
description = "Nonlinear kicker magnet (NKM) and BTS transfer line simulation and optimization framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Chong Shik Park"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "accelerator-toolbox>=0.7.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
moga = [
    "pymoo>=0.6.0",
]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=6.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --disable-warnings"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
