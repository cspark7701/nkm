name: Paper Regression Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  paper-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,moga]

      - name: Run Paper Reproduction Pipeline Script
        run: |
          python3 scripts/reproduce_paper.py

      - name: Run Paper Regression Test Suite
        run: |
          pytest -v tests/test_paper_regression.py
